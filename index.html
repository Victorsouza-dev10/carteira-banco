<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Carteira</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


</head>

<body>


    <div class="pagina-login">
        <div class="card-login">
    <h1>Minha Carteira</h1>

    <form>
        <label for="email">E-mail:</label>
        <input type="email" id="email">

        <label for="senha">Senha:</label>
        <input type="password" id="senha">

        <br>
        <label for="lembrar">
            <input type="checkbox" id="lembrar">
            Lembrar meu e-mail
        </label>
        <br>

        <button type="submit">Entrar</button>
    </form>

    
    </form>


   <p>Não tem uma conta ? </p>


    <p><a href="#" id="linkCriarConta">Criar uma conta</a></p>

    <div id="formCriarConta" style="display: none;">
        <h2>Criar Conta</h2>
        <label for="novoEmail">E-mail:</label>
        <input type="email" id="novoEmail">

        <label for="novaSenha">Senha:</label>
        <input type="password" id="novaSenha">

        <button id="btnCriarConta">Cadastrar</button>
    </div>
    </div>
 </div>


      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
      <script src="script.js"></script>
</body>
</html>
